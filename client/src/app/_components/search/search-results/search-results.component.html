<div class="results-container">
  <!-- Paginator -->
  <p-paginator
    [rows]="pageSize()"
    [totalRecords]="results().length"
    [rowsPerPageOptions]="[15, 30, 50]"
    (onPageChange)="onPageEvent($event)"
    [showFirstLastIcon]="true"
    [first]="first()"
    class="mt-1 mb-1"
    [class.invisible]="results().length === 0"
    [class.visible]="results().length > 0"
  ></p-paginator>

  <!-- Results Table -->
  <div class="results">
    <p-table
      [value]="displayedData()"
      [tableStyle]="{ 'min-width': '50rem' }"
      [paginator]="false"
      [class.invisible]="results().length === 0"
      [class.visible]="results().length > 0"
      [rowTrackBy]="trackByFn"
      [scrollable]="true"
      scrollHeight="flex"
      [frozenColumns]="frozenCols"
      [columns]="cols"
      [stripedRows]="true"
      [rowHover]="true"
    >
      <ng-template pTemplate="header" let-columns>
        <tr>
          @for (col of frozenCols; track col.field) {
            <th pFrozenColumn>{{ col.header }}</th>
          }
          @for (col of columns; track col.field) {
            <th>{{ col.header }}</th>
          }
          <th pFrozenColumn alignFrozen="right">Azione</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-element let-columns="columns">
        <tr>
          @for (col of frozenCols; track col.field) {
            <td pFrozenColumn>{{ element[col.field] }}</td>
          }
          @for (col of columns; track col.field) {
            <td>{{ element[col.field] }}</td>
          }
          <td pFrozenColumn alignFrozen="right">
            <button
              pButton
              icon="pi pi-download"
              class="p-button-rounded p-button-primary download-button"
              (click)="onDownload(
                element.server,
                element.channel,
                element.bot,
                element.package,
                element.filename,
                element.filesize
              )"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center">Nessun risultato trovato</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
