<div class="spatial-container fade-in">
  <!-- Glowing Ambient Mesh behind -->
  <div class="aurora-bg">
    <div class="aurora-1"></div>
    <div class="aurora-2"></div>
    <div class="aurora-3"></div>
  </div>

  <!-- Top Bar -->
  <nav class="spatial-top-bar">
    <div class="brand">
      <span class="logo-text">XDCC<span class="neo-accent">Mule</span></span>
      <span class="badge">v3.0.0</span>
    </div>
    <button class="theme-toggle-btn" (click)="themeBase.toggleTheme()" aria-label="Toggle Theme"
      [title]="'Tema attuale: ' + themeBase.currentTheme()">
      <i class="pi"
        [class.pi-moon]="themeBase.currentTheme() === 'dark' || (themeBase.currentTheme() === 'system' && themeBase.isDarkActive())"
        [class.pi-sun]="themeBase.currentTheme() === 'light' || (themeBase.currentTheme() === 'system' && !themeBase.isDarkActive())"></i>
    </button>
  </nav>

  <!-- Central Command -->
  <main class="command-center">
    <div class="welcome-label">
      <span class="pulse-dot"></span>
      Rete XDCC Globale
    </div>

    <h1 class="main-title">Trova il tuo prossimo file.</h1>
    <p class="subtitle">Ricerca fulminea. Download diretto. Nessuna coda.</p>

    <a routerLink="/search" class="giant-search-trigger">
      <i class="pi pi-search search-icon"></i>
      <span class="placeholder-text">Cerca tra milioni di pacchetti, film, serie, musica...</span>
      <div class="kbd-wrap">
        <span class="kbd">Go</span>
      </div>
    </a>
  </main>

  <!-- Spatial Dock -->
  <div class="spatial-dock-wrapper">
    <div class="spatial-dock">
      @for (item of dockItems; track item.link) {
      <a [routerLink]="item.link" class="dock-item" [title]="item.title">
        <div class="dock-icon-wrapper">
          <i [class]="'pi pi-' + item.icon"></i>
        </div>
        <span class="dock-tooltip">{{ item.title }}</span>
      </a>
      }
    </div>
  </div>
</div>
